<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览器检查</title>
  <meta name="description" content="检查你的浏览器支持多少现代 Web 能力，识别内核版本与国产、套壳浏览器，并给出 0–100 的评分。">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="startup-error" class="startup-error" role="alert">
    若检测程序没有启动，请确认 JavaScript 已启用、网络正常且脚本未被拦截，或尝试更新浏览器，然后<a href="">刷新重试</a>。
  </p>
  <div id="startup-loading" class="loading-overlay" role="status" hidden>
    <div class="loading-content">
      <div class="loader" aria-hidden="true"></div>
      <div class="loading-text">正在加载检测程序...</div>
    </div>
  </div>
  <main id="app" hidden></main>

  <script src="startup.js"></script>
  <script id="vue-script" defer src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.runtime.global.prod.js"
          integrity="sha384-b/AjbaAXeH6ypBqFEi7YTDZEXY0MhY7emG1a6rRRZKjOzGUM88lZ9eHxgkRgUNBR" crossorigin="anonymous"></script>
  <script id="render-script" defer src="render.js"></script>
  <script id="app-script" defer src="app.js"></script>
</body>
</html>
